INHERIT: docs/mkdocs-base.yml

site_name: cvxrisk
site_url: https://www.cvxgrp.org/cvxrisk/
repo_url: https://github.com/cvxgrp/cvxrisk
repo_name: cvxgrp/cvxrisk

docs_dir: docs

theme:
  name: material
  # Referenced from rhiza's published site rather than vendored: the template
  # stopped delivering docs/assets/rhiza-logo.svg in v1.7.0.
  logo: https://jebel-quant.github.io/rhiza/assets/rhiza-logo.svg
  favicon: https://jebel-quant.github.io/rhiza/assets/rhiza-logo.svg

nav:
  - Home: index.md
  - Mathematics: models.md
  - Notebooks:
    - Demo: notebooks/demo.html
    - Factor Model: notebooks/factormodel.html
    - Large: notebooks/large.html
    - Sample: notebooks/sample.html
    - Tilting: notebooks/tilting.html
  - Reports:
    - Test Report: reports/html-report/report.html
    - Coverage Report: reports/html-coverage/index.html
    - Benchmark Histogram: reports/benchmarks/histogram.svg
  - Development:
    - Rhiza: development/rhiza.md
